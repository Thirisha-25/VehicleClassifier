{% extends 'base.html' %}
{% load static %}

{% block title %}
Predict Vehicle
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow-lg border-0 rounded-4">

            <div class="card-header bg-primary text-white text-center">
                <h3>
                    <i class="fas fa-car-side"></i>
                    Vehicle Prediction
                </h3>
            </div>

            <div class="card-body p-4">

                <form method="POST">
                    {% csrf_token %}

                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Engine Size (L)</label>
                            <input type="number"
                                   step="0.1"
                                   name="engine_size"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Horsepower</label>
                            <input type="number"
                                   name="horsepower"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Weight (kg)</label>
                            <input type="number"
                                   name="weight"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Number of Doors</label>
                            <input type="number"
                                   name="doors"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Number of Seats</label>
                            <input type="number"
                                   name="seats"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fuel Type</label>

                            <select name="fuel" class="form-select">
                                <option value="Petrol">Petrol</option>
                                <option value="Diesel">Diesel</option>
                                <option value="Electric">Electric</option>
                                <option value="Hybrid">Hybrid</option>
                            </select>

                        </div>

                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-magic"></i>
                            Predict Vehicle
                        </button>
                    </div>

                </form>

            </div>

        </div>

        {% if prediction %}
        <div class="card shadow mt-4 text-center">
            <div class="card-body">

                <h3 class="text-success">Prediction Result</h3>

                <h2 class="mb-4">{{ prediction }}</h2>

                {% if image %}
                <img src="{% static 'images/' %}{{ image }}"
                     alt="{{ prediction }}"
                     class="img-fluid rounded shadow"
                     style="max-width:350px;">
                {% endif %}

            </div>
        </div>
        {% endif %}

    </div>

</div>

{% endblock %}
